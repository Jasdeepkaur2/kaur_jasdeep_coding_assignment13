name: CI - Code Quality Checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css}"

      - name: Run ESLint
        run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0

      - name: Run Tests
        run: CI=true npm test -- --watchAll=false
